name: Release

# Every push to develop runs release-please. It keeps a "release PR" up to date
# (version bump in Cargo.toml + Cargo.lock + CHANGELOG, computed from the
# conventional commits). Merging that PR makes release-please tag the commit and
# create the GitHub release; the `build` job then builds the Windows installer,
# signs it and attaches it, its signature and `latest.json` to that release.
#
# `latest.json` is what the app (and the previous Tauri build) polls at
# https://github.com/<repo>/releases/latest/download/latest.json
#
# The build job lives in this same workflow on purpose: a tag created with
# GITHUB_TOKEN does not trigger other workflows.
#
# If the build job fails after the release was created, re-run it for that tag
# from the Actions tab ("Run workflow" on this workflow, with the tag as input).
# Re-running the failed run itself would use the workflow file as it was then.
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the installer for and attach it to (e.g. v0.1.7)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please's TOML updater cannot target a package by name in Cargo.lock,
  # so the lockfile is synced here. Separate job on purpose: a failure here must
  # never block a release build.
  sync-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.lock with the bumped version
        run: cargo update --workspace

      - name: Commit if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock" -- Cargo.lock
          git push

  build-windows:
    needs: release-please
    # `!cancelled()` lets this job run when release-please was skipped, which is
    # the case for a manual run.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches the app version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match the workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # Same bundler Tauri uses, as a standalone tool. Pinned, and installed as a
      # cached binary rather than compiled on every release.
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-packager
          version: "=0.11.8"
          locked: true

      # Builds the release binary (beforePackagingCommand) and makes the NSIS
      # installer. Signing is a separate step, see below.
      - name: Build and package
        working-directory: crates/app
        run: cargo packager --release

      # The same minisign key as the Tauri build, so installs of either build
      # accept the update, signed with the same tool and version the Tauri build
      # used (@tauri-apps/cli 2.11.1, with an empty password env var, exactly as
      # in the previous release workflow). The .sig it writes is a standard
      # minisign signature, which cargo-packager-updater verifies.
      #
      # Do not use `cargo packager` / `cargo packager signer sign` for this: they
      # fail on this key with "Wrong password for that key", with or without a
      # password. See guides/ARCHITECTURE.md.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Sign the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.11.1 signer sign "dist/pr-dashboard_${VERSION}_x64-setup.exe"

      - name: Generate latest.json
        shell: bash
        run: |
          installer="dist/pr-dashboard_${VERSION}_x64-setup.exe"
          ls -la dist
          test -f "$installer" || { echo "missing $installer" >&2; exit 1; }
          test -f "$installer.sig" || { echo "missing $installer.sig (is the signing key set?)" >&2; exit 1; }
          notes=$(gh release view "$TAG" --json body --jq .body)
          python scripts/make_latest_json.py \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --installer "$installer" \
            --signature "$installer.sig" \
            --notes "$notes" \
            --out dist/latest.json

      # The release already exists (created by release-please) and keeps its
      # generated changelog as body.
      - name: Attach to the release
        shell: bash
        run: |
          gh release upload "$TAG" \
            "dist/pr-dashboard_${VERSION}_x64-setup.exe" \
            "dist/pr-dashboard_${VERSION}_x64-setup.exe.sig" \
            dist/latest.json \
            --clobber
