[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.9"
edition = "2021"

# GPUI is unusably slow unoptimized (hundreds of elements repainted per frame).
# Optimize every dependency even in dev builds; the workspace crates stay
# debuggable and rebuild quickly.
[profile.dev.package."*"]
opt-level = 3
